format = 4
id = "github.com/LiteLDev/LegacyRemoteCall"
version = "0.23.0"

[info]
name = "LegacyRemoteCall"
description = "A part of LegacyScriptEngine"
tags = ["library", "lse"]

# The default variant holds both builds: the server build for the server side and the client build
# for the client side. There is no "client" variant. The client entry depends on the bare
# LeviLamina: a lip.toml dependency is never rewritten to "#client", and lip.toml releases of
# LeviLamina have no "client" variant. Its range starts above 26.60.6, the last tooth.json release
# of LeviLamina, because the "" variant of a tooth.json release is the server build.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyRemoteCall-server-windows-x64.zip"]
place = [{ src = "LegacyRemoteCall/", dest = "mods/LegacyRemoteCall/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyRemoteCall-client-windows-x64.zip"]
place = [{ src = "LegacyRemoteCall/", dest = "mods/LegacyRemoteCall/" }]
